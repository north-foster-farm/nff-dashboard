name: CodeQL

# Static analysis of the JavaScript, only for changes headed to main:
# a pull request into it, or a push to it. The check is named codeql
# and is required on main. It fails on an open high or critical alert
# (scripts/codeql/gate.mjs). Dismissing an alert in GitHub, with a
# reason, is the recorded exception and is James's call.
#
# A commit is scanned once. A run first looks for an analysis of the
# commit by SHA and, finding one, skips the scan and checks the alerts
# on the ref it was made for. A pull request whose base is behind its
# head merges to exactly its head, so it reuses the head's analysis.
# A rebase-merge writes new commits, which the push to main scans.
#
# The log holds counts only; the alerts themselves are in GitHub's
# code scanning, not here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Look for an analysis of this commit
        id: seen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/codeql/gate.mjs seen

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: steps.seen.outputs.seen != 'true'
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: steps.seen.outputs.seen != 'true'
        with:
          category: /language:javascript-typescript

      - name: Fail on a high or critical alert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ steps.seen.outputs.ref || github.ref }}
        run: node scripts/codeql/gate.mjs check
