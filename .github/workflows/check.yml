# CI (H5): `npm run check` — eslint (errors), stylelint, the unit
# suite with coverage thresholds, and the house format rules — on
# every PR and every push. The `check` job is the required status
# in the main-branch ruleset, so a PR can't merge (and therefore
# nothing can reach the auto-deploying main) until it's green.
name: check

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the development machine's node major — npm's peer/
          # optional resolution differs across npm majors, and the
          # lockfile must validate under the same resolver that
          # writes it.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
