# CI (H5): `npm run check` — eslint (errors), stylelint, the unit
# suite with coverage thresholds, and the house format rules. The
# `check` job is the required status in the main-branch ruleset, so
# a PR can't merge (and therefore nothing can reach the
# auto-deploying main) until it's green.
name: check

# Every PR gets exactly one run, from `pull_request`. The push
# trigger is scoped to main so a branch push doesn't run the same
# commit a second time; main still needs its own run because the
# merge deploys and fires no PR event. `src/lib/ciWorkflows.test.js`
# holds the scoping rule.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The suite's timezone (America/New_York) is set in
    # vitest.config.js, so a local run and CI run the same way.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the development machine's node major — npm's peer/
          # optional resolution differs across npm majors, and the
          # lockfile must validate under the same resolver that
          # writes it.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
