<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS home-screen icon. Full-bleed PNG (iOS rounds the corners);
         exported from public/icons/icon.svg — see public/icons/README.md. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="theme-color" content="#101614" />
    <title>North Foster Farm — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    />
    <style>
      /* Nacelle — local custom font from dotcolon.net. Files live in
         /public/fonts/ as .woff2. */
      @font-face {
        font-family: 'Nacelle';
        src: url('/fonts/Nacelle-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nacelle';
        src: url('/fonts/Nacelle-Italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nacelle';
        src: url('/fonts/Nacelle-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nacelle';
        src: url('/fonts/Nacelle-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Nacelle';
        src: url('/fonts/Nacelle-BoldItalic.woff2') format('woff2');
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
      /* Place-tree indentation (Chores / Sites). Tight on phones so the
         deep place hierarchy doesn't squeeze chore names into a sliver
         of the screen. Theme-independent — declared once here. */
      :root {
        --tree-indent: 18px;
        --tree-rail: 12px;
      }
      @media (max-width: 639px) {
        :root {
          --tree-indent: 7px;
          --tree-rail: 6px;
        }
      }
      /* Dark theme (default). Brand anchor #297D5A lightened to #4cba85 for legible
         accent on near-black surfaces. Earthy, warm, slightly green-tinted neutrals. */
      :root,
      html[data-theme="dark"] {
        --c-bg: #101614;
        --c-surface: #151a15;
        --c-surface-alt: #1d231e;
        --c-border: #3e473d;
        --c-text: #f2efe4;
        --c-text-dim: #c4bfad;
        --c-text-muted: #8e8877;
        --c-text-faint: #6a6658;
        --c-accent: #adc8ad;
        --c-accent-deep: #297d5a;
        --c-warn: #e6b85a;
        --c-resolved: #4cba85;
        --c-project: #7d9ec9;  /* slate-blue-400 (Schedule project time) */
        --c-chore:   #2bb6a2;  /* teal-400 — chore identity (slice D recolor) */
        --c-event:   #b6afe9;  /* periwinkle-300 — event identity (F8) */
        --c-mulberry:   #cf5b9f;  /* mulberry-400 (palette, unmapped) */
        --c-terracotta: #cf6742;  /* terracotta-400 (palette, unmapped) */
        --c-on-accent: #0d1410;
        --c-on-cat: #0d1410;
        /* Event-kind colors mapped to the decorative palette
           (src/styles.css). Dark theme uses the lighter -300/-400 shades
           for legibility on near-black surfaces. */
        --c-cat-fm:           #5dd585;  /* celadon-400 */
        --c-cat-popup:        #ffaa33;  /* amber-glow-400 */
        --c-cat-egg:          #68d5fd;  /* sky-aqua-300 */
        --c-cat-chore:        #c4bfad;
        --c-cat-deliveries:   #ffbf66;  /* honey-bronze-300 */
        --c-cat-farm-visits:  #ff6675;  /* hot-fuchsia-300 */
        --c-cat-pickups:      #65cda2;  /* turf-green-400 */
        --c-cat-processing:   #ff3347;  /* hot-fuchsia-400 */
        --c-cat-default:      #8e8877;
        --c-row-active: rgba(173, 200, 173, 0.12);
        --c-row-hover: rgba(173, 200, 173, 0.07);
        --c-row-active-dim: rgba(255, 255, 255, 0.05);
        color-scheme: dark;
      }

      /* Light theme. Warm off-white background, brand used directly as accent.
         Same earthy character, just inverted. */
      html[data-theme="light"] {
        --c-bg: #f6f6f6;
        --c-surface: #ffffff;
        --c-surface-alt: #ececec;
        --c-border: #d6d6d6;
        --c-text: #14180f;
        --c-text-dim: #2f3329;
        --c-text-muted: #4d4a3e;
        --c-text-faint: #6f6b5d;
        --c-accent: #297d5a;
        --c-accent-deep: #1d5a40;
        --c-warn: #a06d10;
        --c-resolved: #297d5a;
        --c-project: #3f6da3;  /* slate-blue-600 (Schedule project time) */
        --c-chore:   #0c7e6e;  /* teal-600 — chore identity (slice D recolor) */
        --c-event:   #5b54a8;  /* periwinkle-600 — event identity (F8) */
        --c-mulberry:   #9c2e6c;  /* mulberry-600 (palette, unmapped) */
        --c-terracotta: #9c3f23;  /* terracotta-600 (palette, unmapped) */
        --c-on-accent: #ffffff;
        --c-on-cat: #ffffff;
        /* Light theme uses -600/-700 shades for contrast on light bg. */
        --c-cat-fm:           #2aa252;  /* celadon-600 */
        --c-cat-popup:        #cc7700;  /* amber-glow-600 */
        --c-cat-egg:          #0295ca;  /* sky-aqua-600 */
        --c-cat-chore:        #7a7666;
        --c-cat-deliveries:   #995900;  /* honey-bronze-700 */
        --c-cat-farm-visits:  #cc0014;  /* hot-fuchsia-600 */
        --c-cat-pickups:      #21ab4f;  /* tea-green-600 */
        --c-cat-processing:   #99000f;  /* hot-fuchsia-700 */
        --c-cat-default:      #7a7666;
        --c-row-active: rgba(41, 125, 90, 0.16);
        --c-row-hover: rgba(41, 125, 90, 0.09);
        --c-row-active-dim: rgba(0, 0, 0, 0.06);
        color-scheme: light;
      }

      @keyframes nff-flyout-in {
        from { transform: translateX(-8px); opacity: 0; }
        to   { transform: translateX(0);    opacity: 1; }
      }
      @keyframes nff-flyout-out {
        from { transform: translateX(0);    opacity: 1; }
        to   { transform: translateX(-8px); opacity: 0; }
      }
      /* Day-strip pager: the incoming rail group slides from the side the
         motion came from, so the scroll direction is obvious. */
      @keyframes nff-page-from-right {
        from { transform: translateX(16px); opacity: 0.3; }
        to   { transform: translateX(0);    opacity: 1; }
      }
      @keyframes nff-page-from-left {
        from { transform: translateX(-16px); opacity: 0.3; }
        to   { transform: translateX(0);     opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .nff-anim-page { animation: none !important; }
      }

      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--c-bg);
        color: var(--c-text);
        font-family: 'Nacelle', system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 120ms ease, color 120ms ease;
      }
    </style>
    <script>
      // Apply saved theme + density before React boots to avoid a flash of
      // the wrong palette / size.
      (function () {
        try {
          var theme = localStorage.getItem('nff-theme');
          theme = theme === 'light' || theme === 'dark' ? theme : 'dark';
          document.documentElement.setAttribute('data-theme', theme);

          var density = localStorage.getItem('nff-density');
          density = (density === 'comfortable' || density === 'spacious')
            ? density : 'compact';
          document.documentElement.setAttribute('data-density', density);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-density', 'compact');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
